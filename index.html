<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Material Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        .status-received {
            background-color: #d4edda;
            color: #155724;
        }
        .status-pending {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Group Material Tracker</h1>

    <form id="materialForm">
        <label for="personName">Person Name:</label>
        <input type="text" id="personName" required>

        <label for="materialName">Material Needed:</label>
        <input type="text" id="materialName" required>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="1" required>

        <label for="ordered">Ordered:</label>
        <select id="ordered">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <button type="button" onclick="addRequirement()">Add Requirement</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Person Name</th>
                <th>Material Needed</th>
                <th>Quantity</th>
                <th>Ordered (Yes/No)</th>
                <th>Received (Yes/No)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Person 1</td>
                <td>Material A</td>
                <td>5</td>
                <td>Yes</td>
                <td class="status-received">Yes</td>
            </tr>
            <tr>
                <td>Person 2</td>
                <td>Material B</td>
                <td>3</td>
                <td>No</td>
                <td class="status-pending">No</td>
            </tr>
            <!-- New rows will be added here dynamically -->
        </tbody>
    </table>

    <script>
        function addRequirement() {
            const personName = document.getElementById('personName').value;
            const materialName = document.getElementById('materialName').value;
            const quantity = document.getElementById('quantity').value;
            const ordered = document.getElementById('ordered').value;

            const table = document.querySelector('table tbody');
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${personName}</td>
                <td>${materialName}</td>
                <td>${quantity}</td>
                <td>${ordered}</td>
                <td class="${ordered === 'Yes' ? 'status-received' : 'status-pending'}">${ordered === 'Yes' ? 'Yes' : 'No'}</td>
            `;
            
            table.appendChild(row);

            // Clear form inputs
            document.getElementById('materialForm').reset();
        }
    </script>
</body>
</html>
